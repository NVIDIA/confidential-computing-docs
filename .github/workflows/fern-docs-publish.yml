# Publishes the site when a change under fern/ merges to main.

name: Publish Fern Docs

on:
  push:
    branches: [main]
    paths:
      - 'fern/**'

concurrency:
  group: fern-docs-publish
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: NVIDIA/docs-builder/.github/workflows/_fern_docs_publish.yml@main  # zizmor: ignore[unpinned-uses] -- Fern OIDC trust pins refs/heads/main
    secrets:
      DOCS_FERN_AWS_ROLE_TO_ASSUME: ${{ secrets.DOCS_FERN_AWS_ROLE_TO_ASSUME }}
      DOCS_FERN_SECRET_ID: ${{ secrets.DOCS_FERN_SECRET_ID }}
