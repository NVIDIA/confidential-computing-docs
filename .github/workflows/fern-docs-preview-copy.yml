# Builds the pr-<N> Fern preview when copy-pr-bot mirrors a trusted or
# `/ok to test <SHA>`-approved PR commit to pull-request/<N>, and comments the
# preview URL on the PR.

name: "Preview Fern Docs"

on:
  push:
    branches:
      - "pull-request/[0-9]+"

concurrency:
  group: fern-docs-preview-copy-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  preview:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: NVIDIA/docs-builder/.github/workflows/_fern_docs_preview_copy.yml@main  # zizmor: ignore[unpinned-uses] -- Fern OIDC trust pins refs/heads/main
    with:
      fern-package: https://github.com/mikemckiernan/fern/releases/download/v5.143.2-nvidia.2/fern-api-5.143.2-nvidia.2.tgz
      fern-package-sha256: e9ab702a4d6736280cb8fb542f9edd1661ea83c045f8cb4a39148ae37f7aba1d
    secrets:
      DOCS_FERN_AWS_ROLE_TO_ASSUME: ${{ secrets.DOCS_FERN_AWS_ROLE_TO_ASSUME }}
      DOCS_FERN_SECRET_ID: ${{ secrets.DOCS_FERN_SECRET_ID }}
