instances:
  - url: nvidia-confidential-computing.docs.buildwithfern.com/confidential-computing
    custom-domain: docs.nvidia.com/confidential-computing
    multi-source: true

title: NVIDIA Confidential Computing

layout:
  searchbar-placement: header
  page-width: 1376px
  sidebar-width: 248px
  content-width: 812px
  hide-feedback: true

colors:
  accentPrimary:
    dark: "#76B900"
    light: "#245501"
  background:
    light: "#FFFFFF"
    dark: "#000000"

theme:
  page-actions: toolbar
  footer-nav: minimal

logo:
  dark: ./assets/NVIDIA_dark.svg
  light: ./assets/NVIDIA_light.svg
  height: 20
  href: /confidential-computing
  right-text: Confidential Computing

favicon: ./assets/NVIDIA_symbol.svg

css:
  - ./main.css

check:
  rules:
    broken-links: error

# Each deployment pattern is a Fern product with its own version list so CBM,
# CVM, and CoCo can release on independent cadences. The landing product holds
# the overview plus the shared guides and has its own cadence. Version lists
# are maintained by hand; see README "Releases".
products:
  - display-name: Confidential Computing
    subtitle: Overview and shared guides
    path: ./products/confidential-computing/current.yml
    slug: ""
    versions:
      - display-name: Dev
        path: ./products/confidential-computing/current.yml
        slug: dev
        availability: beta

  - display-name: Confidential Bare Metal
    subtitle: Dedicated-node deployments
    path: ./products/bare-metal/current.yml
    slug: bare-metal
    versions:
      - display-name: Dev
        path: ./products/bare-metal/current.yml
        slug: dev
        availability: beta

  - display-name: Confidential Virtual Machine
    subtitle: Confidential VM deployments
    path: ./products/cvm/current.yml
    slug: cvm
    versions:
      - display-name: Dev
        path: ./products/cvm/current.yml
        slug: dev
        availability: beta

  - display-name: Confidential Containers
    subtitle: CoCo on Kubernetes
    path: ./products/containers/current.yml
    slug: containers
    versions:
      - display-name: v1.1.0
        ref: containers-v1.1.0
        slug: v1.1.0
      - display-name: v1.0.0
        ref: containers-v1.0.0
        slug: v1.0.0
      - display-name: Dev
        path: ./products/containers/current.yml
        slug: dev
        availability: beta
