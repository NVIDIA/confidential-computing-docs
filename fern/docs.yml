instances:
  - url: nvidia-confidential-computing.docs.buildwithfern.com/confidential-computing
    custom-domain: docs.nvidia.com/confidential-computing
    multi-source: true

title: NVIDIA Confidential Computing

global-theme: nvidia

logo:
  right-text: Confidential Computing

check:
  rules:
    broken-links: error

# Each deployment pattern is a Fern product with its own version list so CBM,
# CVM, and CoCo can release on independent cadences. The landing product holds
# the unversioned overview and shared guides. Product version lists are
# maintained by hand; see README "Releases".
products:
  - display-name: Confidential Computing
    subtitle: Overview and shared guides
    path: ./products/confidential-computing/current.yml
    slug: ""

  - display-name: Confidential Bare Metal
    subtitle: Dedicated-node deployments
    path: ./products/bare-metal/current.yml
    slug: bare-metal
    versions:
      - display-name: v1.0.0
        path: ./products/bare-metal/v1.0.0.yml
        slug: v1.0.0
      - display-name: Dev
        path: ./products/bare-metal/current.yml
        slug: dev
        availability: beta

  - display-name: Confidential Virtual Machines
    subtitle: Confidential VM deployments
    path: ./products/virtual-machines/current.yml
    slug: virtual-machines
    versions:
      - display-name: v1.0.0
        path: ./products/virtual-machines/v1.0.0.yml
        slug: v1.0.0
      - display-name: Dev
        path: ./products/virtual-machines/current.yml
        slug: dev
        availability: beta

  - display-name: Confidential Containers
    subtitle: CoCo on Kubernetes
    path: ./products/containers/current.yml
    slug: containers
    versions:
      - display-name: v1.1.0
        path: ./products/containers/v1.1.0.yml
        slug: v1.1.0
      - display-name: v1.0.0
        path: ./products/containers/v1.0.0.yml
        slug: v1.0.0
      - display-name: Dev
        path: ./products/containers/current.yml
        slug: dev
        availability: beta
